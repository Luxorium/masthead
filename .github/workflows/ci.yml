# Check, unit tests, build and a packaging smoke test on Linux, macOS and Windows.
# Needs no Claude account: the unit tests never start Claude Code. The browser test (test/ui.e2e.mjs)
# joins once the fake backend exists (MASTHEAD_FAKE_BACKEND=1, docs/plans/0.2.0/backends.md §8).
name: ci

on:
  push:
    branches: [main, next]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # A plain install: the build tools need their optional platform packages (esbuild, rolldown).
      # The Agent SDK's platform package (a private Claude Code binary) comes along here; Masthead never runs it.
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:web
      - run: npm run build
      - name: Pack and install the package
        shell: bash
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          # What a user runs: --omit=optional skips the SDK's private Claude Code binary.
          npm install -g --omit=optional "$RUNNER_TEMP"/*.tgz
          masthead --version
