# Check, unit tests, build and a packaging smoke test on Linux, macOS and Windows.
# Needs no Claude account: the unit tests never start Claude Code, and the browser job runs the page
# against the fake backend (MASTHEAD_BACKEND=fake with MASTHEAD_ALLOW_FAKE=1; see scripts/ci-e2e.mjs).
name: ci

on:
  push:
    branches: [main, next]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # A plain install: the build tools need their optional platform packages (esbuild, rolldown).
      # The Agent SDK's platform package (a private Claude Code binary) comes along here; Masthead never runs it.
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:web
      - run: npm run build
      - name: Pack and install the package
        shell: bash
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          # What a user runs: --omit=optional skips the SDK's private Claude Code binary.
          npm install -g --omit=optional "$RUNNER_TEMP"/*.tgz
          masthead --version

  browser:
    # The page in a real browser (Playwright's Chromium) against a server on the fake backend:
    # no Claude account, no Claude Code. scripts/ci-e2e.mjs makes fresh folders and a free port.
    name: browser / ${{ matrix.os }}
    # Independent of the unit jobs, so one system's unit failure does not hide the others' browser results.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Cache Playwright's Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .playwright-browsers
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then npx playwright-core install --with-deps chromium; else npx playwright-core install chromium; fi
      - name: Browser test on the fake backend
        run: node scripts/ci-e2e.mjs e2e-shots
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-shots-${{ matrix.os }}
          path: e2e-shots
          if-no-files-found: ignore
