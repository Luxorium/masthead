name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: Masthead version (`masthead --version`)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
    validations:
      required: true
  - type: input
    id: backend
    attributes:
      label: Claude Code version (`claude --version`)
  - type: textarea
    id: logs
    attributes:
      label: Output or logs
      description: Remove anything private first. Never paste the contents of the `secret` file or a sign-in address.
      render: text
